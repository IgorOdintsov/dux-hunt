[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dux-hunt"
version = "1.0.0"
description = "Detect CIC::DUX4 fusions from targeted DNA panel BAMs by realigning soft clips to a canonical DUX4 mini-reference"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "pysam>=0.22",
    "click>=8.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
dux-hunt = "dux_hunt.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dux_hunt = ["data/*"]
